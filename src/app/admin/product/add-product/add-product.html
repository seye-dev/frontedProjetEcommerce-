<div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Nouveau produits</h5>
        <br />

        <!-- General Form Elements -->
        <form  enctype="multipart/form-data">
            <div class="row mb-3">
            <label class="col-sm-2 col-form-label">Categorie</label>
            <div class="col-sm-10">
              <select class="form-select" name="type_p" aria-label="Default select example">
                <option selected></option>
                <option>Montre</option>
                <option>Lunette</option>
                <option>Ceinture</option>
              </select>
            </div>
          </div>
          <div class="row mb-3">
            <label for="inputText" class="col-sm-2 col-form-label">Libelé</label>
            <div class="col-sm-10">
              <input type="text" name="libele" class="form-control" />
            </div>
          </div>
          <div class="row mb-3">
            <label for="inputNumber" class="col-sm-2 col-form-label">Slug</label>
            <div class="col-sm-10">
              <input class="form-control" name="slug" type="text" id="formFile" />
            </div>
          </div>
          <div class="row mb-3">
            <label for="inputPassword" class="col-sm-2 col-form-label">Description</label>
            <div class="col-sm-10">
              <textarea class="form-control" name="description" style="height: 100px"></textarea>
            </div>
          </div>
          <div class="row mb-3">
            <label for="inputNumber" class="col-sm-2 col-form-label">Prix</label>
            <div class="col-sm-10">
              <input type="number" name="prix" class="form-control" />
            </div>
          </div>
          <div class="row mb-3">
            <label for="inputNumber" class="col-sm-2 col-form-label">Quantité</label>
            <div class="col-sm-10">
              <input type="number" name="quantite" class="form-control" />
            </div>
          </div>
          <div class="row mb-3">
            <label class="col-sm-2 col-form-label"></label>
            <div class="col-sm-10">
              <button type="submit" class="btn btn-success">Enregistrer</button>
            </div>
          </div>
        </form>
        <!-- End General Form Elements -->
      </div>
    </div>
  </div>
</div>
