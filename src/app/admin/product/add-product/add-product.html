<div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Nouveau produits</h5>
        <br />
                  <!-- Affichage des messages -->
            @if (successMessage) {
              <div class="alert alert-success">
                {{ successMessage }}
              </div>
            }

            @if (errorMessage) {
              <div class="alert alert-danger">
                {{ errorMessage }}
              </div>
            }

        <!-- General Form Elements -->
        <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
            
          <div class="row mb-3">
            <label for="inputText" class="col-sm-2 col-form-label">Categorie</label>
            <div class="col-sm-10">
              <input type="number" formControlName="category_id" class="form-control" />
            </div>
          </div>
          <div class="row mb-3">
            <label for="inputText" class="col-sm-2 col-form-label">Libelé</label>
            <div class="col-sm-10">
              <input type="text" formControlName="name" class="form-control" />
            </div>
          </div>

          <div class="row mb-3">
            <label for="inputPassword" class="col-sm-2 col-form-label">Description</label>
            <div class="col-sm-10">
              <textarea class="form-control" formControlName="description" style="height: 100px"></textarea>
            </div>
          </div>
          <div class="row mb-3">
            <label for="inputNumber" class="col-sm-2 col-form-label">Prix</label>
            <div class="col-sm-10">
              <input type="number" formControlName="price" class="form-control" />
            </div>
          </div>
          <div class="row mb-3">
            <label for="inputNumber" class="col-sm-2 col-form-label">Quantité</label>
            <div class="col-sm-10">
              <input type="number" formControlName="stock" class="form-control" />
            </div>
          </div>
          <div class="row mb-3">
            <label for="inputNumber" class="col-sm-2 col-form-label">Image</label>
            <div class="col-sm-10">
              <input type="file"  accept="image/*"
        class="form-control" (change)="onImageSelected($event)" class="form-control" />
            </div>
          </div>
          <div class="row mb-3">
            <label class="col-sm-2 col-form-label"></label>
            <div class="col-sm-10">
              <button type="submit" class="btn btn-success">Enregistrer</button>
            </div>
          </div>
        </form>
        <!-- End General Form Elements -->
      </div>
    </div>
  </div>
</div>
