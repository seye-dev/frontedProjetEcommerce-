
<div class="row">
  <div class="col-lg-12">
    <br /><br />

    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Nouveau catégorie</h5>
        <br />
        @if (errorMessage) {
							<div class="danger">
								{{ errorMessage }}
							</div>
          }

        <!-- General Form Elements -->
        <form [formGroup]="formGroup" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
          <div class="row mb-3">
            
            <label for="inputText" class="col-sm-2 col-form-label">Libele</label>
            <div class="col-sm-10">
              <input type="text"formControlName="name"  class="form-control" />
            </div>
          </div>

          <div class="row mb-3">
            <label for="inputPassword" class="col-sm-2 col-form-label">Slug</label>
            <div class="col-sm-10">
              <textarea class="form-control"formControlName="slug" style="height: 100px"></textarea>
            </div>
          </div>
          <br />

          <div class="row mb-3">
            <label class="col-sm-2 col-form-label"></label>
            <div class="col-sm-10">
              <button type="submit" name="ajouter" class="btn btn-primary">Enregistrer</button>
            </div>
          </div>
        </form>
        <br /><br /><br /><br /><br /><br />
      </div>
    </div>
  </div>
</div>
