<div class="post-entry">
	<a routerLink="{{linkUrl()}}" class="post-thumbnail"><img src="{{imageUrl()}}" alt="Image" class="img-fluid"></a>
	<div class="post-content-entry">
        <h3><a routerLink="{{linkUrl()}}">{{title()}}</a></h3>
        <div class="meta">
            <span>{{description()}}</span>
        </div>
	</div>
</div>
